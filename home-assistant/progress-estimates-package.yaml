# Starts the same setup on every slot that holds a battery: copies the source slot's staged mode, charge and
# discharge current and cycles to the other slots (each keeps its own battery capacity), then presses Apply on each.
script:
  office_battery_charger_start_all:
    alias: Office battery charger - start the same on all slots
    icon: mdi:battery-sync
    mode: single
    fields:
      source:
        description: Slot whose settings are copied (1-4)
        example: 1
    sequence:
      - repeat:
          for_each: [1, 2, 3, 4]
          sequence:
            - if:
                - condition: template
                  value_template: >-
                    {{ is_state('binary_sensor.office_battery_charger_slot_' ~ repeat.item ~ '_battery', 'on') }}
              then:
                - if:
                    - condition: template
                      value_template: "{{ repeat.item | int != source | int }}"
                  then:
                    - action: select.select_option
                      target:
                        entity_id: "select.office_battery_charger_slot_{{ repeat.item }}_setting_mode"
                      data:
                        option: "{{ states('select.office_battery_charger_slot_' ~ source ~ '_setting_mode') }}"
                    - action: number.set_value
                      target:
                        entity_id: "number.office_battery_charger_slot_{{ repeat.item }}_setting_charge_current"
                      data:
                        value: "{{ states('number.office_battery_charger_slot_' ~ source ~ '_setting_charge_current') | float(0.5) }}"
                    - action: number.set_value
                      target:
                        entity_id: "number.office_battery_charger_slot_{{ repeat.item }}_setting_discharge_current"
                      data:
                        value: "{{ states('number.office_battery_charger_slot_' ~ source ~ '_setting_discharge_current') | float(0.3) }}"
                    - action: number.set_value
                      target:
                        entity_id: "number.office_battery_charger_slot_{{ repeat.item }}_setting_cycles"
                      data:
                        value: "{{ states('number.office_battery_charger_slot_' ~ source ~ '_setting_cycles') | float(3) }}"
                - action: button.press
                  target:
                    entity_id: "button.office_battery_charger_slot_{{ repeat.item }}_apply_settings"
                - delay: "00:00:02"
