          {% set simple = mode not in ['Refresh', 'Break-In', 'Discharge', 'Cycle'] %}
          {% set left = ((tgt - mah) / ic * 60 if simple else (rated - mah) / idc * 60 if mode == 'Discharge' else total - run) %}
          {% set left = [left | round(0) | int, 0] | max %}
          {% set frac = (mah / tgt if simple else mah / rated if mode == 'Discharge' else run / total) %}
          {{ [(frac * 100) | round(0) | int, 99] | min }}{% endif %}
